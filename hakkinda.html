<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Hakkında — Katran Dergi</title>
    
    <meta name="description" content="Katran Dergi hakkında - Misyonumuz, vizyonumuz ve kırmızı karanfil sembolümüzün anlamı. Objektifliğe ve gri olmaya çağrı.">
    <meta name="keywords" content="katran dergi, hakkında, misyon, vizyon, karanfil, edebiyat, sanat, düşünce">
    <meta name="author" content="Katran Dergi">
    
    <meta property="og:title" content="Hakkında — Katran Dergi">
    <meta property="og:description" content="Kırmızı karanfil ektik, katranın bağrına. Misyonumuz, vizyonumuz ve sembolümüzün anlamı.">
    <meta property="og:type" content="website">
    
    <style>
        /* ============================================================
           1. RESET & DEĞİŞKENLER — ANA SİTE İLE AYNI
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --katran: #0a0808;
            --karanfil: #e03131;
            --karanfil-dark: #b71c1c;
            --karanfil-glow: rgba(224, 49, 49, 0.25);
            --karanfil-subtle: rgba(224, 49, 49, 0.06);
            --kagit: #f4efe8;
            --kagit-dark: #e6ded5;
            --toz: #a89e94;
            --altin: #d4a843;
            --muted: #7a7068;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --transition-smooth: 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            --shadow-soft: 0 20px 60px -20px rgba(0, 0, 0, 0.08);
            --shadow-strong: 0 30px 80px -20px rgba(0, 0, 0, 0.15);
            --border-radius-card: 20px;
            --border-radius-btn: 60px;
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --katran: #f4efe8;
            --kagit: #0a0808;
            --kagit-dark: #1a1412;
            --toz: #7a7068;
            --muted: #a89e94;
            --shadow-soft: 0 20px 60px -20px rgba(255, 255, 255, 0.05);
            --shadow-strong: 0 30px 80px -20px rgba(255, 255, 255, 0.08);
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background: var(--kagit);
            color: var(--katran);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: none;
            position: relative;
            transition: background 0.6s ease, color 0.6s ease;
        }

        /* ============================================================
           2. CUSTOM SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--kagit);
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--karanfil);
            border-radius: 20px;
            transition: var(--transition-smooth);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--karanfil-dark);
        }

        /* ============================================================
           3. SELECTION
           ============================================================ */
        ::selection {
            background: var(--karanfil);
            color: var(--kagit);
        }

        /* ============================================================
           4. CURSOR — ANA SİTE İLE AYNI
           ============================================================ */
        .custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid var(--karanfil);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }
        .custom-cursor.hover {
            width: 60px;
            height: 60px;
            background: rgba(224, 49, 49, 0.08);
            border-color: var(--karanfil-glow);
        }
        .custom-cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--karanfil);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease, background 0.3s ease;
        }
        .custom-cursor-dot.hover {
            transform: translate(-50%, -50%) scale(1.8);
            background: var(--kagit);
        }

        /* ============================================================
           5. SCROLL PROGRESS
           ============================================================ */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--karanfil), var(--karanfil-dark));
            z-index: 9997;
            transition: width 0.1s ease;
            border-radius: 0 10px 10px 0;
            box-shadow: 0 0 20px var(--karanfil-glow);
        }

        /* ============================================================
           6. THEME TOGGLE
           ============================================================ */
        .theme-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--karanfil);
            background: var(--kagit);
            color: var(--katran);
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 999;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: var(--shadow-strong);
        }
        .theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           7. SITE WRAPPER
           ============================================================ */
        .site-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            opacity: 1;
            animation: siteFadeIn 1s ease forwards;
        }
        @keyframes siteFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           8. BACKGROUND AMBIENT
           ============================================================ */
        .bg-ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .bg-ambient .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbDrift 20s ease-in-out infinite alternate;
        }
        .bg-ambient .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -5%;
            background: rgba(224, 49, 49, 0.04);
            animation-duration: 25s;
        }
        .bg-ambient .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -10%;
            right: -5%;
            background: rgba(224, 49, 49, 0.03);
            animation-duration: 30s;
            animation-delay: 5s;
        }
        .bg-ambient .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(224, 49, 49, 0.02);
            animation-duration: 35s;
            animation-delay: 10s;
        }

        @keyframes orbDrift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.9);
            }
            100% {
                transform: translate(40px, -20px) scale(1.05);
            }
        }

        /* ============================================================
           9. HEADER — ANA SİTE İLE AYNI
           ============================================================ */
        .masthead {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 0 1.8rem;
            margin-bottom: 3rem;
            position: sticky;
            top: 0;
            background: rgba(244, 239, 232, 0.72);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            transition: var(--transition-smooth);
            border-radius: 0 0 20px 20px;
        }
        [data-theme="dark"] .masthead {
            background: rgba(10, 8, 8, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .masthead.scrolled {
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.04);
            background: rgba(244, 239, 232, 0.88);
            padding: 1.2rem 0;
        }
        [data-theme="dark"] .masthead.scrolled {
            background: rgba(10, 8, 8, 0.92);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            text-decoration: none;
            transition: var(--transition-smooth);
            position: relative;
        }
        .brand::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--karanfil);
            transition: var(--transition-smooth);
        }
        .brand:hover::after {
            width: 100%;
        }
        .brand:hover {
            opacity: 0.85;
        }

        .brand-name {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--katran);
            transition: var(--transition-smooth);
        }
        .brand-name .red {
            color: var(--karanfil);
            transition: var(--transition-smooth);
        }
        .brand:hover .brand-name .red {
            text-shadow: 0 0 30px rgba(224, 49, 49, 0.15);
        }

        .brand-tagline {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--toz);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-left: 1px solid var(--toz);
            padding-left: 0.8rem;
            display: none;
            transition: var(--transition-smooth);
        }
        @media (min-width: 760px) {
            .brand-tagline {
                display: inline-block;
            }
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.15rem;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.78rem;
            padding: 0.5rem 1.1rem;
            border-radius: 40px;
            transition: var(--transition-smooth);
            letter-spacing: 0.02em;
            position: relative;
            background: transparent;
            cursor: none;
        }
        .nav-links a svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            flex-shrink: 0;
            transition: var(--transition-smooth);
        }
        .nav-links a::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            background: var(--karanfil-subtle);
            opacity: 0;
            transform: scale(0.8);
            transition: var(--transition-smooth);
        }
        .nav-links a:hover::before {
            opacity: 1;
            transform: scale(1);
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--karanfil);
            transition: var(--transition-smooth);
            transform: translateX(-50%);
        }
        .nav-links a:hover::after {
            width: 35%;
        }
        .nav-links a:hover {
            color: var(--katran);
        }
        .nav-links a:hover svg {
            stroke: var(--karanfil);
            transform: translateY(-1px);
        }
        .nav-links a span,
        .nav-links a svg {
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           10. ABOUT HERO
           ============================================================ */
        .about-hero {
            text-align: center;
            padding: 2rem 0 3rem;
        }
        .about-hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 6vw, 4.5rem);
            font-weight: 900;
            line-height: 1.05;
            margin-bottom: 0.5rem;
        }
        .about-hero h1 .highlight {
            color: var(--karanfil);
        }
        .about-hero .hero-sub {
            font-size: 1.1rem;
            color: var(--muted);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ============================================================
           11. ABOUT CONTENT
           ============================================================ */
        .about-section {
            background: var(--kagit);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--border-radius-card);
            padding: 3.5rem 3rem;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .about-section {
            border-color: rgba(255, 255, 255, 0.04);
        }
        .about-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--karanfil), var(--karanfil-dark));
        }
        .about-section:hover {
            box-shadow: var(--shadow-strong);
            transform: translateY(-2px);
        }

        .about-section .section-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--katran);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .about-section .section-title .accent-line {
            display: inline-block;
            width: 40px;
            height: 3px;
            background: var(--karanfil);
            border-radius: 10px;
        }
        .about-section .section-title .icon {
            font-size: 1.5rem;
        }

        .about-section p {
            color: var(--katran);
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 1.2rem;
            font-weight: 400;
        }
        .about-section p:last-child {
            margin-bottom: 0;
        }

        .about-section .highlight-text {
            color: var(--karanfil);
            font-weight: 600;
        }

        /* Quote */
        .quote-block {
            background: rgba(224, 49, 49, 0.04);
            border-left: 4px solid var(--karanfil);
            padding: 1.8rem 2rem;
            margin: 1.5rem 0 2rem;
            border-radius: 0 var(--border-radius-card) var(--border-radius-card) 0;
            position: relative;
            transition: var(--transition-smooth);
        }
        [data-theme="dark"] .quote-block {
            background: rgba(224, 49, 49, 0.06);
        }
        .quote-block:hover {
            background: rgba(224, 49, 49, 0.06);
        }
        [data-theme="dark"] .quote-block:hover {
            background: rgba(224, 49, 49, 0.08);
        }
        .quote-block .quote-mark {
            font-size: 2.5rem;
            color: var(--karanfil);
            opacity: 0.2;
            font-family: var(--font-serif);
            line-height: 1;
            position: absolute;
            top: 0.3rem;
            left: 0.8rem;
        }
        .quote-block p {
            font-style: italic;
            font-size: 1.1rem;
            color: var(--katran);
            padding-left: 1.5rem;
            font-weight: 400;
            margin-bottom: 0;
        }
        .quote-block .quote-author {
            display: block;
            text-align: right;
            font-style: normal;
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 0.5rem;
            padding-right: 0.5rem;
        }

        /* ============================================================
           12. VALUES GRID
           ============================================================ */
        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .value-card {
            background: var(--kagit);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--border-radius-card);
            padding: 2rem 1.5rem;
            text-align: center;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .value-card {
            border-color: rgba(255, 255, 255, 0.04);
        }
        .value-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--karanfil), var(--karanfil-dark));
            opacity: 0;
            transition: var(--transition-smooth);
        }
        .value-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-strong);
        }
        .value-card:hover::before {
            opacity: 1;
        }

        .value-card .value-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--karanfil), var(--karanfil-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: var(--transition-smooth);
        }
        .value-card:hover .value-icon {
            transform: scale(1.1) rotate(-8deg);
        }
        .value-card .value-icon svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-width: 2;
        }

        .value-card h3 {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--karanfil);
            margin-bottom: 0.5rem;
        }
        .value-card p {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.6;
            margin: 0;
        }

        /* ============================================================
           13. FOOTER — ANA SİTE İLE AYNI
           ============================================================ */
        .site-footer {
            background: var(--katran);
            color: var(--kagit);
            padding: 3rem 2rem 2rem;
            margin: 3rem -2rem -2rem;
            border-radius: 24px 24px 0 0;
            border-top: 2px solid var(--karanfil);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .site-footer {
            background: var(--kagit-dark);
            color: var(--katran);
        }
        .site-footer::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(224, 49, 49, 0.025), transparent 40%);
            animation: footerOrb 15s linear infinite;
        }
        @keyframes footerOrb {
            0% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(5%, 8%);
            }
            66% {
                transform: translate(-3%, 4%);
            }
            100% {
                transform: translate(0, 0);
            }
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .footer-content .footer-brand {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 700;
        }
        .footer-content .footer-brand .red {
            color: var(--karanfil);
        }
        .footer-content p {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
            font-weight: 300;
        }
        .footer-divider {
            width: 50px;
            height: 2px;
            background: var(--karanfil);
            margin: 1.2rem auto;
            opacity: 0.2;
            border-radius: 10px;
            transition: var(--transition-smooth);
        }
        .footer-content:hover .footer-divider {
            width: 80px;
            opacity: 0.4;
        }

        .footer-particle {
            position: absolute;
            border-radius: 50%;
            background: var(--karanfil);
            opacity: 0;
            animation: particleRise 12s linear infinite;
        }
        .footer-particle:nth-child(1) {
            width: 4px;
            height: 4px;
            left: 10%;
            bottom: 10%;
            animation-delay: 0s;
        }
        .footer-particle:nth-child(2) {
            width: 3px;
            height: 3px;
            left: 25%;
            bottom: 20%;
            animation-delay: 1.5s;
        }
        .footer-particle:nth-child(3) {
            width: 5px;
            height: 5px;
            left: 45%;
            bottom: 5%;
            animation-delay: 3s;
        }
        .footer-particle:nth-child(4) {
            width: 3px;
            height: 3px;
            left: 65%;
            bottom: 15%;
            animation-delay: 4.5s;
        }
        .footer-particle:nth-child(5) {
            width: 6px;
            height: 6px;
            left: 80%;
            bottom: 8%;
            animation-delay: 6s;
        }
        .footer-particle:nth-child(6) {
            width: 4px;
            height: 4px;
            left: 92%;
            bottom: 25%;
            animation-delay: 7.5s;
        }
        .footer-particle:nth-child(7) {
            width: 3px;
            height: 3px;
            left: 55%;
            bottom: 30%;
            animation-delay: 9s;
        }
        .footer-particle:nth-child(8) {
            width: 5px;
            height: 5px;
            left: 15%;
            bottom: 35%;
            animation-delay: 10.5s;
        }

        @keyframes particleRise {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) scale(0.5);
            }
            10% {
                opacity: 0.15;
            }
            30% {
                opacity: 0.25;
            }
            60% {
                opacity: 0.15;
                transform: translateY(-200px) translateX(30px) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(-400px) translateX(-20px) scale(0.2);
            }
        }

        /* ============================================================
           14. RESPONSIVE
           ============================================================ */
        @media (max-width: 860px) {
            .custom-cursor,
            .custom-cursor-dot {
                display: none !important;
            }
            body {

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .custom-cursor,
            .custom-cursor-dot {
                display: none !important;
            }
            body {
                cursor: auto;
            }
        }

        @media print {

                color: white !important;

            }
            .site-footer::before {

            }
        }
    </style>
